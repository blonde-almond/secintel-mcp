[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secintel-mcp"
dynamic = ["version"]
description = "A security intelligence MCP server: CVE triage (NVD, EPSS, CISA KEV), package vulnerabilities (OSV) and IOC extraction."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "security", "cve", "epss", "kev", "osv", "threat-intelligence", "ioc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
secintel-mcp = "secintel_mcp.server:main"

[tool.hatch.version]
path = "src/secintel_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/secintel_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
